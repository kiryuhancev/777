name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      html_sha256: ${{ steps.site.outputs.html_sha256 }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Check game mathematics
        run: node tools/math-tests.cjs
      - name: Build standalone site
        id: site
        run: |
          python3 tools/build-site.py
          node --check /tmp/football-cascade-release.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Verify currently published game
        env:
          GAME_URL: https://kiryuhancev.github.io/777/
          HTML_SHA256: ${{ steps.site.outputs.html_sha256 }}
        run: python3 tools/verify-site.py

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out deployment verifier
        uses: actions/checkout@v4
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published game
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
          HTML_SHA256: ${{ needs.build.outputs.html_sha256 }}
        run: python3 tools/verify-site.py
